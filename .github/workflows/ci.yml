name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # Track the latest Zig master nightly. This deliberately trades
      # reproducibility for currency: the newest nightly is always hosted on
      # ziglang.org (so there is no community-mirror-purge risk), and CI failing
      # after an upstream breaking change is the early-warning signal we want for
      # a master-tracking project. `minimum_zig_version` in build.zig.zon records
      # the last version this was verified against. If master breaks the build,
      # port the sources and bump that floor.
      - name: Install Zig (master)
        uses: mlugg/setup-zig@v2
        with:
          version: master
          # Disable cross-run caching: the integration test bakes ephemeral
          # per-run paths (e.g. the zig executable path) into a compiled binary,
          # and restoring a stale .zig-cache across runs makes those paths point
          # at directories that no longer exist. The project is tiny, so building
          # fresh each run costs little and removes a class of CI heisenbugs.
          use-cache: false

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

      - name: Bench
        run: zig build bench

      - name: Integration test
        run: zig build itest

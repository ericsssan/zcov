name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # Pin the exact nightly the project builds against, instead of tracking
      # `master` (which drifts and breaks the build). The version is pinned HERE
      # explicitly; keep it in sync with `minimum_zig_version` in build.zig.zon
      # when bumping (setup-zig only consults that field when `version` is
      # omitted). setup-zig fetches from the Zig community mirrors and
      # checksum-verifies the download. NOTE: ziglang.org keeps only the latest
      # nightly, so this exact build survives only as long as some community
      # mirror still retains it; if all mirrors prune it this step fails and the
      # version must be re-pinned.
      - name: Install Zig (pinned)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0-dev.657+2faf8debf
          # Disable cross-run caching: the integration test bakes ephemeral
          # per-run paths (e.g. the zig executable path) into a compiled binary,
          # and restoring a stale .zig-cache across runs makes those paths point
          # at directories that no longer exist. The project is tiny, so building
          # fresh each run costs little and removes a class of CI heisenbugs.
          use-cache: false

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

      - name: Bench
        run: zig build bench

      - name: Integration test
        run: zig build itest
